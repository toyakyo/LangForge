name: Build Linux / macOS

# 手動觸發：GitHub → Actions → "Build Linux / macOS" → Run workflow
# 產物在該次執行頁面底部的 Artifacts（LangForge-linux / LangForge-macos）
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # 較舊的 glibc，Ubuntu 22.04 以上皆可執行
            name: linux
          - os: macos-latest      # Apple Silicon (arm64)
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk xvfb fonts-noto-cjk scrot

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check IS_OEM is False
        shell: bash
        run: |
          grep -E "^IS_OEM\s*=\s*False" langforge/core/langforge.py

      - name: Build (PyInstaller onefile)
        shell: bash
        run: |
          pyinstaller main.py \
            --name=LangForge \
            --onefile \
            --clean \
            --add-data="langforge/asset:langforge/asset" \
            --add-data="langforge/core:langforge/core" \
            --add-data="favicon.ico:." \
            --collect-all=mistralai \
            --collect-all=google \
            --collect-all=anthropic \
            --collect-all=openai \
            --collect-all=groq
          ls -lh dist/

      - name: Smoke test - app stays alive for 20s (Linux, Xvfb)
        if: matrix.name == 'linux'
        run: |
          xvfb-run -a bash -c './dist/LangForge & PID=$!; sleep 20; kill -0 $PID && echo "ALIVE" && kill $PID'

      - name: Smoke test - app stays alive for 20s (macOS)
        if: matrix.name == 'macos'
        run: |
          ./dist/LangForge & PID=$!; sleep 20; kill -0 $PID && echo "ALIVE" && kill $PID

      - name: Package
        shell: bash
        run: |
          cd dist
          chmod +x LangForge
          tar -czf LangForge-${{ matrix.name }}.tar.gz LangForge
          shasum -a 256 LangForge-${{ matrix.name }}.tar.gz LangForge | tee SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LangForge-${{ matrix.name }}
          path: |
            dist/LangForge-${{ matrix.name }}.tar.gz
            dist/SHA256.txt
